<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Lost Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/student/dashboard.html"><img src="/assets/logo.png" alt="Logo" style="height: 40px;"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/student/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="#" id="logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="mb-4">Report a Lost Item</h2>
    <div class="card shadow p-4">
      <div id="alert" class="alert d-none"></div>
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Item Title *</label>
          <input type="text" id="title" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select id="category" class="form-select">
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Documents">Documents/ID</option>
            <option value="Keys">Keys</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Location Lost *</label>
          <input type="text" id="location" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date Lost *</label>
          <input type="date" id="date_lost" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Upload Photo (optional)</label>
          <input type="file" id="image" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn btn-success w-100 py-3">Submit</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/base.html';
    });

    document.getElementById('uploadForm').addEventListener('submit', async e => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      alert.classList.add('d-none');

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value.trim());
      formData.append('description', document.getElementById('description').value.trim());
      formData.append('category', document.getElementById('category').value);
      formData.append('location', document.getElementById('location').value.trim());
      formData.append('date_lost', document.getElementById('date_lost').value);
      if (document.getElementById('image').files[0]) {
        formData.append('image', document.getElementById('image').files[0]);
      }

      try {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.error || 'Upload failed');

        alert.className = 'alert alert-success';
        alert.textContent = 'Item uploaded successfully!';
        alert.classList.remove('d-none');
        document.getElementById('uploadForm').reset();
      } catch (err) {
        alert.className = 'alert alert-danger';
        alert.textContent = err.message;
        alert.classList.remove('d-none');
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
