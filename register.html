<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Item Locator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 460px;">
      <h3 class="text-center mb-4">Register (Student)</h3>
      <div id="alert" class="alert d-none"></div>
      <form id="regForm">
        <div class="mb-3">
          <input type="text" id="name" class="form-control" placeholder="Full Name" required>
        </div>
        <div class="mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="tel" id="phone" class="form-control" placeholder="Phone" required>
        </div>
        <div class="mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-3">Register</button>
      </form>
      <p class="text-center mt-3">
        Already have an account? <a href="/base.html">Login</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async e => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      alert.classList.add('d-none');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.error || 'Registration failed');

        alert.className = 'alert alert-success';
        alert.textContent = 'Registered successfully! Redirecting...';
        alert.classList.remove('d-none');

        localStorage.setItem('token', data.token);
        window.location.href = '/student/dashboard.html';
      } catch (err) {
        alert.className = 'alert alert-danger';
        alert.textContent = err.message;
        alert.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
