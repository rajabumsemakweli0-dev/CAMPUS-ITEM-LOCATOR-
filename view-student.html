<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/admin/dashboard.html">
        <img src="/assets/logo.png" alt="Logo" style="height: 40px;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/admin/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="#" id="logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="mb-4">Manage Students</h2>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/base.html';
    });

    async function loadStudents() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/base.html';
        return;
      }

      try {
        const res = await fetch('/api/admin/students', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const students = await res.json();
        const tbody = document.getElementById('studentsTable');
        tbody.innerHTML = '';

        if (students.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No students registered yet.</td></tr>';
          return;
        }

        students.forEach(student => {
          tbody.innerHTML += `
            <tr>
              <td>${student.name}</td>
              <td>${student.email}</td>
              <td>${student.phone || '—'}</td>
              <td>
                <span class="badge bg-${student.status === 'active' ? 'success' : 'danger'}">
                  ${student.status.toUpperCase()}
                </span>
              </td>
              <td>
                ${student.status === 'active' ? 
                  `<button class="btn btn-sm btn-danger block-btn" data-id="${student.id}">Block</button>` :
                  `<button class="btn btn-sm btn-success unblock-btn" data-id="${student.id}">Unblock</button>`
                }
              </td>
            </tr>
          `;
        });

        // Add event listeners kwa block/unblock buttons
        document.querySelectorAll('.block-btn, .unblock-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const newStatus = btn.classList.contains('block-btn') ? 'blocked' : 'active';

            try {
              const res = await fetch(`/api/admin/students/${id}/status`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ status: newStatus })
              });

              if (!res.ok) throw new Error('Failed to update status');
              loadStudents(); // Refresh list
            } catch (err) {
              console.error('Block/Unblock error:', err);
            }
          });
        });

      } catch (err) {
        console.error('Load students error:', err);
        document.getElementById('studentsTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading students</td></tr>';
      }
    }

    // Run wakati page inafunguka
    loadStudents();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
