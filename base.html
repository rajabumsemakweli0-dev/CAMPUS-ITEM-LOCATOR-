<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Item Locator - Login</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Icon yako kwa tab ya browser, home screen ya simu, na desktop shortcut -->
  <link rel="icon" href="/assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Meta tags za mobile app (PWA) ili ifunguke kama app halisi -->
  <meta name="theme-color" content="#006400">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  
  <!-- Custom style ili iwe nzuri -->
  <style>
    body {
      background: linear-gradient(135deg, #006400, #228B22);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
    }
    .btn-primary {
      background: #006400;
      border: none;
      padding: 0.8rem;
      font-weight: bold;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background: #004d00;
      transform: translateY(-2px);
    }
    .logo-img {
      max-height: 100px;
      margin-bottom: 1.5rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo yako inayonekana juu ya page -->
    <img src="/assets/icon.png" alt="Campus Item Locator" class="logo-img mx-auto d-block">

    <h3 class="text-center mb-4 fw-bold text-success">Login</h3>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
      </div>

      <div class="mb-4">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Login</button>
    </form>

    <div class="text-center mt-4">
      <p>Don't have an account? 
        <a href="/register.html" class="text-success fw-bold text-decoration-none">
          Register here
        </a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      errorEl.classList.add('d-none');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!data.success) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.remove('d-none');
          return;
        }

        // Hifadhi token
        localStorage.setItem('token', data.token);

        // Redirect kulingana na role
        if (data.role === 'admin') {
          window.location.href = '/admin/dashboard.html';
        } else {
          window.location.href = '/student/dashboard.html';
        }

      } catch (err) {
        errorEl.textContent = 'Network error or server not responding';
        errorEl.classList.remove('d-none');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
