<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="/assets/logo.png" alt="Logo" style="height: 40px;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/student/settings.html"><i class="bi bi-gear"></i> Settings</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="#" id="logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="mb-4">Student Dashboard</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card text-center border-primary shadow-sm">
          <div class="card-body">
            <h5>Total Uploaded</h5>
            <h2 id="total">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center border-danger shadow-sm">
          <div class="card-body">
            <h5>Lost Items</h5>
            <h2 id="lost" class="text-danger">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center border-success shadow-sm">
          <div class="card-body">
            <h5>Found Items</h5>
            <h2 id="found" class="text-success">0</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-5">
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-body">
            <i class="bi bi-eye fs-1 text-primary mb-3"></i>
            <h5>View All Items</h5>
          </div>
          <a href="/student/view-items.html" class="stretched-link"></a>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-body">
            <i class="bi bi-plus-circle fs-1 text-success mb-3"></i>
            <h5>Upload New Item</h5>
          </div>
          <a href="/student/upload-item.html" class="stretched-link"></a>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-body">
            <i class="bi bi-folder fs-1 text-warning mb-3"></i>
            <h5>My Uploaded Items</h5>
          </div>
          <a href="/student/view-uploaded-item.html" class="stretched-link"></a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/base.html';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
